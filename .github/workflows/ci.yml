name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The package builds with TypeScript 6; make sure the native TypeScript 7 compiler accepts it too.
      - name: Typecheck with TypeScript 7
        run: npx -y -p typescript@7.0.2 tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run build
      - name: Check the package contents
        run: npm pack --dry-run
