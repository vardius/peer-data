<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat over socket.io · peer-data</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>Chat over socket.io</h1>
    <p>
      Open this page in another browser: they connect through the signaling server. To open it on another device on your
      network, serve the examples with <code>npm run examples -- --host</code>.
    </p>
    <p id="status" class="status" role="status"></p>
    <ul id="log" class="log" aria-live="polite"></ul>
    <form id="form">
      <label class="visually-hidden" for="text">Message</label>
      <input id="text" autocomplete="off" placeholder="Say something" required />
      <button>Send</button>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
